name: kkn-tulus-besar

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kkn_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - kkn-network

  web:
    image: nginx:alpine
    container_name: kkn_web
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - kkn-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: kkn_db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: kkn_tulus_besar
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secretpassword
      MYSQL_ROOT_PASSWORD: rootpassword
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - kkn-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: kkn_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    networks:
      - kkn-network
    depends_on:
      - db

networks:
  kkn-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
